services:
  - type: web
    name: practicehub-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false

  - type: web
    name: practicehub-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://practicehub-api.onrender.com/api
